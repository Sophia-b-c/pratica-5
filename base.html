<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Jogo de Adivinhação</h1>

        <p>
            Tente adivinhar o número secreto entre <strong>1 e 100</strong>.
            Você possui <strong>10 tentativas</strong>.
        </p>

        <inpu
            type="number"
            id="palpite"
            placeholder="Digite um número de 1 a 100"
        >

        <button id="btnChutar">Chutar</button>

        <p id="mensagem"></p>

        <p id="tentativas"></p>
    </div>

    <script src="script.js"></script>

</body>
</html>
